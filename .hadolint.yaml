---
# hadolint configuration for teknoir-desktop.
#
# Three rules are ignored, all deliberately:
ignored:
  # DL3018: apk package versions are not pinned. The tnctl build stage is
  # pinned by the digest of golang:1.26-alpine, and that image's apk index
  # only keeps the current version of git, so pinning a version in the
  # Dockerfile would break the build as soon as the index moves on. Same
  # reasoning as DL3008 below.
  - DL3018
  # DL3008: apt package versions are not pinned. Debian trixie is the pinned
  # base (by digest) and its archive only keeps the current version of each
  # package, so pinning a version in the Dockerfile would break the build as
  # soon as the archive moves on. The base image digest is the real pin.
  - DL3008
  # DL3020: ADD with a remote URL. Used once, for the noVNC tarball, because
  # ADD downloads it and RUN verifies NOVNC_SHA256 with sha256sum -c; with
  # COPY the checksum could not be verified. (Docker recommends ADD for a
  # remote archive with a checksum.)
  - DL3020
