# GTK4 settings for programs that start before xfsettingsd.
#
# No XFCE 4.20 program is GTK4; Chromium pulls libgtk-4 in and would draw
# its dialogs (file pickers and the like) with it. GTK4 has no theme-name
# setting here: it always uses libadwaita, and prefer-dark is what makes
# that dark. The same values as the GTK3 file, minus the ones GTK4 no longer
# has.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-font-name=Hanken Grotesk 10
gtk-enable-animations=false
