<?xml version="1.0"?>

<!-- Fontconfig: Hanken Grotesk is the UI font and JetBrains Mono the
     monospace one, for every program in the session and for every web page in
     Chromium, which asks fontconfig for its generic families.

     binding="same" keeps the generic name's own rank in the font list (a page
     asking for sans-serif still gets its fallbacks after Hanken Grotesk), and
     <prefer> only moves these two families to the front. Debian's
     conf.d/51-local.conf includes this file, and 51 sorts before 60-latin, so
     these preferences win over the stock ones.

     DejaVu stays installed and behind them: Hanken Grotesk has no box-drawing
     or CJK glyphs, and fonts-liberation2 keeps Chromium's layout metrics close
     to what web sites expect. The fonts themselves are in
     /usr/local/share/fonts/teknoir/, pinned in the Dockerfile. -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Hanken Grotesk</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Hanken Grotesk</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
