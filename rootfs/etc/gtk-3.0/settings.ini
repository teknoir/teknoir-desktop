# GTK3 settings for programs that start before xfsettingsd.
#
# The normal path is xfsettingsd, which reads the xsettings channel
# (/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml) and exports the
# theme, the icons, the cursor and the fonts to every GTK program over the
# XSettings protocol. A program that starts in that first moment of the
# session, before xfsettingsd has exported them, would come up with Debian's
# defaults: the light Xfce theme, Tango icons and DejaVu. This file is the
# fallback such a program reads itself, so it names the same values.
#
# Keep it in step with xsettings.xml; the gtk-settings test compares them.
[Settings]
gtk-theme-name=Teknoir
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Hanken Grotesk 10
gtk-application-prefer-dark-theme=true
gtk-enable-animations=false
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
