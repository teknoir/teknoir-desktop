# teknoir-desktop, virtual mode: the container IS the desktop.
#
# TigerVNC Xvnc runs an XFCE session with Chromium inside the pod; websockify
# serves the noVNC client on port 6080 and bridges its WebSocket to Xvnc over
# a unix socket. This is an example of what the Teknoir platform renders for a
# TeknoirBot; the real manifests are generated by the platform.
#
# Nothing here is exposed outside the cluster: the desktop is meant to be
# reached through the platform's authenticated WireGuard HTTP/WebSocket proxy
# only, and the NetworkPolicy below enforces that no other pod reaches it.
# Never add a NodePort, a LoadBalancer or an Ingress to this Service.
#
# The image reference below is :main for readability. Deployments pin a digest.
apiVersion: v1
kind: Namespace
metadata:
  name: teknoir-desktop
  labels:
    app.kubernetes.io/name: teknoir-desktop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktop
  namespace: teknoir-desktop
  labels:
    app.kubernetes.io/name: teknoir-desktop
    app.kubernetes.io/instance: desktop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teknoir-desktop
      app.kubernetes.io/instance: desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teknoir-desktop
        app.kubernetes.io/instance: desktop
    spec:
      # The desktop never talks to the Kubernetes API and needs no Service
      # links. Without a token, a page that escapes the renderer or a user in
      # the terminal finds no API credential in the pod.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Chromium's renderer sandbox needs an unprivileged user namespace,
        # which RuntimeDefault refuses. The Localhost profile is RuntimeDefault
        # plus chroot/clone/unshare, so Chromium runs with its sandbox. The
        # file must exist on the node at
        # /var/lib/kubelet/seccomp/profiles/teknoir-desktop.json (a copy of
        # deploy/seccomp/teknoir-desktop.json, see deploy/seccomp/README.md).
        # Restricted pod security allows Localhost profiles.
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/teknoir-desktop.json
      containers:
        - name: desktop
          image: ghcr.io/teknoir/teknoir-desktop:main
          imagePullPolicy: IfNotPresent
          env:
            - name: DESKTOP_MODE
              value: virtual
            - name: DESKTOP_GEOMETRY
              value: 1280x800
            - name: DESKTOP_DEPTH
              value: "24"
            - name: DESKTOP_BROWSER
              value: "true"
            - name: DESKTOP_BROWSER_URL
              value: about:blank
          ports:
            - name: http
              containerPort: 6080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["/usr/local/bin/desktop-healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: run
              mountPath: /run/desktop
            - name: dshm
              mountPath: /dev/shm
            - name: home
              mountPath: /home/desktop
            - name: tmp
              mountPath: /tmp
      volumes:
        # /run/desktop: the X socket and Xauthority. kubelet makes an emptyDir
        # world-writable (2777 with fsGroup, no sticky bit), so the 0600 files
        # in it are only private because a single uid runs in this pod. Never
        # share this volume with a second container that has another uid.
        - name: run
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # A PersistentVolumeClaim instead of an emptyDir keeps the desktop's
        # files (downloads, browser profile) across a pod restart.
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: desktop
  namespace: teknoir-desktop
  labels:
    app.kubernetes.io/name: teknoir-desktop
    app.kubernetes.io/instance: desktop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teknoir-desktop
    app.kubernetes.io/instance: desktop
  ports:
    - name: http
      port: 6080
      targetPort: http
      protocol: TCP
---
# Deny all ingress to the desktop pod. The Service has no authentication
# behind it, so without this any pod on the device could open the desktop.
# With kube-router (k3s) traffic from the pod's own node (kubelet probes, the
# hostNetwork wg-agent) is still admitted, so the platform's WireGuard proxy
# still reaches it; on a multi-node Robot schedule the desktop on wg-agent's
# node (or add an ipBlock rule for that node), or the proxy cannot reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: desktop
  namespace: teknoir-desktop
spec:
  podSelector: {}
  policyTypes: [Ingress]
